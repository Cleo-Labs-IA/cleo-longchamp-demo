<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Longchamp · Connexion à Cleo</title><link rel="stylesheet" href="/login.css"></head>
<body><main><div class="brand">cleo<span>×</span>LONGCHAMP</div><p class="eyebrow">VOTRE ESPACE DE VEILLE</p><h1>Retrouvez votre veille.</h1><p class="intro">Un code temporaire envoyé par e-mail à chaque connexion.</p>
<form id="login"><label for="email">Adresse professionnelle</label><input id="email" name="email" type="email" autocomplete="username" required autofocus><p id="error" role="alert"></p><button type="submit">Recevoir mon code →</button></form>
<section id="code-step" hidden><p id="sent-to" class="intro" aria-live="polite"></p><form id="verify"><label for="code">Code reçu par e-mail</label><input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required><p class="help">Valable 10 minutes, pour une seule connexion.</p><p id="code-error" role="alert"></p><button type="submit">Se connecter →</button></form><button type="button" id="resend" class="secondary">Renvoyer un code</button><button type="button" id="change-email" class="text-button">Utiliser une autre adresse</button></section>
<p class="help">Accès réservé aux personnes invitées. Aucun mot de passe à retenir.</p></main><footer>Longchamp · Veille accompagnée par Cleo</footer><script src="/login.js"></script></body></html>
